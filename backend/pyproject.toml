[project]
name = "portfolio-backend"
version = "1.0.0"
description = "High-performance Python 3.14 & Django 6.1 Serverless Backend API for Portfolio"
readme = "README.md"
requires-python = "~=3.14.0"
dependencies = [
    "django>=6.1.0,<6.2.0",
    "django-ninja>=1.3.0",
    "psycopg[binary,pool]>=3.2.0",
    "django-cors-headers>=4.3.0",
    "whitenoise>=6.6.0",
    "pydantic[email]>=2.7.0",
    "email-validator>=2.0.0",
    "python-dotenv>=1.0.0",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"
